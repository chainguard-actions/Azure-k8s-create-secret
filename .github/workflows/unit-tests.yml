name: 'Unit Tests'
on: # rebuild any PRs and main branch changes
   pull_request:
   push:
      branches:
         - main
         - 'releases/*'

permissions: {}

jobs:
   build: # make sure build/ci works properly
      name: Run Unit Tests
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1
         - name: npm install
           id: npm-install
           run: |
              npm install
         - name: Run npm test
           id: npm-test
           run: |
              npm test

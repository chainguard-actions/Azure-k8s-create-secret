name: Test missing required secret-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake kubeconfig to pass cluster context check
        run: |
          mkdir -p /tmp/fake-kube
          cat > /tmp/fake-kube/config <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://fake-cluster.example.com
            name: fake-cluster
          contexts:
          - context:
              cluster: fake-cluster
              user: fake-user
            name: fake-context
          current-context: fake-context
          users:
          - name: fake-user
            user:
              token: fake-token
          EOF

      - id: action
        uses: .
        env:
          KUBECONFIG: /tmp/fake-kube/config
        # Intentionally omit secret-name to trigger required input error
        continue-on-error: true

      - name: Assert action failed due to missing secret-name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when secret-name is not provided, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when secret-name was not provided"

name: Test missing required secret-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without secret-name (expect failure)
        id: action
        uses: .
        with:
          secret-type: generic
          string-data: '{"key1":"value1"}'
        continue-on-error: true

      - name: Assert action failed due to missing secret-name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when secret-name is not provided, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required secret-name input is missing"

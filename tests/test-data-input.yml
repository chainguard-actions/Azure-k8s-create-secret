name: Test data input (base64-encoded secret data)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake kubeconfig to satisfy any config lookup
        run: |
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
            name: fake-cluster
          contexts:
          - context:
              cluster: fake-cluster
              user: fake-user
            name: fake-context
          current-context: fake-context
          users:
          - name: fake-user
            user:
              token: fake-token
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          secret-type: 'Opaque'
          secret-name: 'my-data-secret'
          data: '{"username":"dXNlcm5hbWU=","password":"cGFzc3dvcmQ="}'

      - name: Assert action ran with data input (no cluster is expected to cause failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SECRET_NAME: ${{ steps.action.outputs.secret-name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "secret-name output: $SECRET_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SECRET_NAME" ]; then
              echo "FAIL: action succeeded but secret-name output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with secret-name='$SECRET_NAME'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real cluster available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

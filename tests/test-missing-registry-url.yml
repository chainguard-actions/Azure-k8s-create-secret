name: Test missing container-registry-url validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
            name: mock-cluster
          contexts:
          - context:
              cluster: mock-cluster
              user: mock-user
              namespace: default
            name: mock-context
          current-context: mock-context
          users:
          - name: mock-user
            user:
              token: fake-token
          EOF
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Run action with username/password but no registry URL (expect failure)
        id: action
        uses: .
        with:
          secret-name: my-registry-secret
          secret-type: kubernetes.io/dockerconfigjson
          container-registry-username: myuser
          container-registry-password: mypassword
        continue-on-error: true

      - name: Assert action failed due to missing registry URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when container-registry-url is missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when container-registry-url is missing"

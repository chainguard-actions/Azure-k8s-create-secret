name: Test secret creation without explicit namespace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kubectl
        run: |
          curl -Lo ./kubectl "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install kwokctl
        run: |
          KWOK_VERSION=v0.5.1
          curl -Lo ./kwokctl "https://github.com/kubernetes-sigs/kwok/releases/download/${KWOK_VERSION}/kwokctl-linux-amd64"
          chmod +x ./kwokctl
          sudo mv ./kwokctl /usr/local/bin/kwokctl
          kwokctl --version

      - name: Start kwok cluster (binary runtime)
        run: |
          mkdir -p $HOME/.kube
          kwokctl create cluster --name test-cluster --runtime=binary --wait 120s
          kwokctl get kubeconfig --name test-cluster > $HOME/.kube/kwok-config
          echo "KUBECONFIG=$HOME/.kube/kwok-config" >> $GITHUB_ENV

      - name: Verify cluster is ready
        run: |
          kubectl cluster-info
          kubectl get namespaces

      - id: create-secret
        uses: .
        with:
          secret-type: 'kubernetes.io/dockerconfigjson'
          secret-name: 'no-namespace-secret'
          container-registry-url: 'docker.io'
          container-registry-username: 'dockeruser'
          container-registry-password: 'dockerpass'

      - name: Assert secret was created in default namespace
        run: |
          echo "Checking if secret 'no-namespace-secret' exists in default namespace..."
          if ! kubectl get secret no-namespace-secret -n default; then
            echo "FAIL: secret 'no-namespace-secret' was not found in default namespace"
            exit 1
          fi
          SECRET_TYPE=$(kubectl get secret no-namespace-secret -n default -o jsonpath='{.type}')
          echo "Secret type: $SECRET_TYPE"
          if [ "$SECRET_TYPE" != "kubernetes.io/dockerconfigjson" ]; then
            echo "FAIL: expected secret type 'kubernetes.io/dockerconfigjson', got '$SECRET_TYPE'"
            exit 1
          fi
          echo "PASS: secret created in default namespace with correct type"

      - name: Cleanup kwok cluster
        if: always()
        run: kwokctl delete cluster --name test-cluster

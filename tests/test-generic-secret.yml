name: Test generic (Opaque) secret type with string-data
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake kubeconfig to pass cluster context check
        run: |
          mkdir -p /tmp/fake-kube
          cat > /tmp/fake-kube/config <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://fake-cluster.example.com
            name: fake-cluster
          contexts:
          - context:
              cluster: fake-cluster
              user: fake-user
            name: fake-context
          current-context: fake-context
          users:
          - name: fake-user
            user:
              token: fake-token
          EOF

      - id: action
        uses: .
        env:
          KUBECONFIG: /tmp/fake-kube/config
        with:
          secret-name: my-generic-secret
          secret-type: generic
          string-data: '{"username":"admin","password":"s3cr3t"}'
        continue-on-error: true

      - name: Assert action ran past input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SECRET_NAME_OUTPUT: ${{ steps.action.outputs.secret-name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "secret-name output: $SECRET_NAME_OUTPUT"
          # The action should fail because the fake cluster is unreachable,
          # but it should NOT fail due to missing inputs or missing KUBECONFIG.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran past input validation (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

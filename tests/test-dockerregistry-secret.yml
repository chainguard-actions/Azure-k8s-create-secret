name: Test docker-registry secret type with mock kubeconfig
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock kubeconfig
        run: |
          mkdir -p /tmp/kube
          cat > /tmp/kube/config <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
              insecure-skip-tls-verify: true
            name: test-cluster
          contexts:
          - context:
              cluster: test-cluster
              user: test-user
              namespace: default
            name: test-context
          current-context: test-context
          users:
          - name: test-user
            user:
              token: fake-token
          EOF
          echo "Kubeconfig written to /tmp/kube/config"
          cat /tmp/kube/config

      - id: action
        uses: .
        with:
          secret-name: my-registry-secret
          secret-type: kubernetes.io/dockerconfigjson
          container-registry-url: myregistry.azurecr.io
          container-registry-username: myuser
          container-registry-password: mypassword
          container-registry-email: user@example.com
          namespace: default
        continue-on-error: true
        env:
          KUBECONFIG: /tmp/kube/config

      - name: Assert action attempted to connect (not a KUBECONFIG error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because it can't connect to the fake cluster,
          # but it should NOT fail due to missing KUBECONFIG.
          # Either outcome (success or failure) is acceptable here as long as
          # the action ran past the KUBECONFIG check.
          # Since we can't connect to 127.0.0.1:6443, failure is expected.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past KUBECONFIG check (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

name: Test generic secret with base64 data using mock kubeconfig
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
            name: mock-cluster
          contexts:
          - context:
              cluster: mock-cluster
              user: mock-user
              namespace: default
            name: mock-context
          current-context: mock-context
          users:
          - name: mock-user
            user:
              token: fake-token
          EOF
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Compute base64 encoded value
        id: b64
        run: |
          # base64 encode "myvalue"
          ENCODED=$(echo -n "myvalue" | base64)
          echo "encoded=$ENCODED" >> "$GITHUB_OUTPUT"

      - name: Run action with generic secret type and base64 data (expect failure at API call)
        id: action
        uses: .
        with:
          secret-name: my-data-secret
          secret-type: generic
          data: '{"mykey":"${{ steps.b64.outputs.encoded }}"}'
          namespace: default
        continue-on-error: true

      - name: Assert action failed at API call (not at context check)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the mock cluster is unreachable.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real cluster available), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (no real cluster reachable)"

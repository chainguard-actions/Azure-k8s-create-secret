name: Test generic secret with base64 data input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          secret-type: 'generic'
          secret-name: 'test-data-secret'
          data: '{"key1":"dmFsdWUx","key2":"dmFsdWUy"}'
      - name: Assert action ran with data input (no cluster context expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SECRET_NAME: ${{ steps.action.outputs.secret-name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "secret-name output: $SECRET_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SECRET_NAME" ]; then
              echo "FAIL: action succeeded but secret-name output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with secret-name='$SECRET_NAME'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no cluster context available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

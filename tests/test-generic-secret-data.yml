name: Test generic secret with base64 data input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake kubeconfig to pass cluster context check
        run: |
          mkdir -p /tmp/fake-kube
          cat > /tmp/fake-kube/config <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://fake-cluster.example.com
            name: fake-cluster
          contexts:
          - context:
              cluster: fake-cluster
              user: fake-user
            name: fake-context
          current-context: fake-context
          users:
          - name: fake-user
            user:
              token: fake-token
          EOF

      - id: action
        uses: .
        env:
          KUBECONFIG: /tmp/fake-kube/config
        with:
          secret-name: my-data-secret
          secret-type: Opaque
          data: '{"key1":"dmFsdWUx"}'
        continue-on-error: true

      - name: Assert action attempted to create secret with base64 data (failed at API call, not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake cluster is unreachable,
          # but it should NOT fail due to missing inputs or missing KUBECONFIG.
          # Either failure or success is acceptable here since we can't reach the cluster.
          # The key is that the action ran past input validation with the data field provided.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran past input validation with base64 data input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

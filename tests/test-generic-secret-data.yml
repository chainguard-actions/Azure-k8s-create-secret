name: Test generic secret with base64-encoded data
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock Kubernetes API server
        run: |
          python3 - << 'PYEOF' &
          import http.server, threading, json, time

          class K8sHandler(http.server.BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  pass
              def do_DELETE(self):
                  self.send_response(404)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'kind':'Status','apiVersion':'v1','status':'Failure','reason':'NotFound','code':404}).encode())
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  self.rfile.read(length)
                  self.send_response(201)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'kind':'Secret','apiVersion':'v1','metadata':{'name':'my-data-secret','namespace':'kube-system'},'type':'generic'}).encode())
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'kind':'APIVersions','versions':['v1']}).encode())

          server = http.server.HTTPServer(('127.0.0.1', 18445), K8sHandler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          time.sleep(86400)
          PYEOF
          sleep 1
          echo "Mock K8s API server started on port 18445"

      - name: Set up kubeconfig pointing to mock server
        run: |
          mkdir -p $HOME/.kube
          cat > $HOME/.kube/config-test << 'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: http://127.0.0.1:18445
            name: test-cluster
          contexts:
          - context:
              cluster: test-cluster
              user: test-user
              namespace: kube-system
            name: test-context
          current-context: test-context
          users:
          - name: test-user
            user:
              token: fake-token
          EOF
          sed -i 's/^          //' $HOME/.kube/config-test
          echo "KUBECONFIG=$HOME/.kube/config-test" >> $GITHUB_ENV
          cat $HOME/.kube/config-test

      - id: action
        uses: .
        with:
          secret-name: my-data-secret
          secret-type: generic
          data: '{"my-key":"bXlzZWNyZXR2YWx1ZQ=="}'
          namespace: kube-system

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: '$OUTCOME'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: generic secret with base64 data creation completed successfully"

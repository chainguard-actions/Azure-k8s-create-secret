name: Test generic secret with base64 data
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock kubeconfig
        run: |
          mkdir -p /tmp/kube
          cat > /tmp/kube/config <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
              insecure-skip-tls-verify: true
            name: mock-cluster
          contexts:
          - context:
              cluster: mock-cluster
              user: mock-user
              namespace: default
            name: mock-context
          current-context: mock-context
          users:
          - name: mock-user
            user:
              token: mock-token
          EOF
          echo "KUBECONFIG=/tmp/kube/config" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          secret-name: my-data-secret
          secret-type: generic
          # base64 encoded values: key1=dmFsdWUx (value1), key2=dmFsdWUy (value2)
          data: '{"key1":"dmFsdWUx","key2":"dmFsdWUy"}'
          namespace: default
        continue-on-error: true

      - name: Assert action ran past input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the mock cluster is unreachable,
          # but it should NOT fail due to missing inputs or missing KUBECONFIG.
          # Either failure or success is acceptable here since we can't reach the cluster.
          # The key is that the action ran past input validation (including data input).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran past input validation with data (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

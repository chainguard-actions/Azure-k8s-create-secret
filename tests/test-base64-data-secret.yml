name: Test secret creation with base64-encoded data field
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock kubeconfig
        run: |
          mkdir -p /tmp/kube
          cat > /tmp/kube/config <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
              insecure-skip-tls-verify: true
            name: test-cluster
          contexts:
          - context:
              cluster: test-cluster
              user: test-user
              namespace: default
            name: test-context
          current-context: test-context
          users:
          - name: test-user
            user:
              token: fake-token
          EOF
          echo "Kubeconfig written to /tmp/kube/config"

      - name: Compute base64 encoded values
        id: encode
        run: |
          KEY1=$(echo -n "myvalue" | base64)
          echo "key1=$KEY1" >> $GITHUB_OUTPUT
          echo "Encoded value: $KEY1"

      - id: action
        uses: .
        with:
          secret-name: my-data-secret
          secret-type: Opaque
          data: '{"mykey":"${{ steps.encode.outputs.key1 }}"}'
          namespace: default
        continue-on-error: true
        env:
          KUBECONFIG: /tmp/kube/config

      - name: Assert action ran past KUBECONFIG check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because it can't connect to the fake cluster,
          # but it should NOT fail due to missing KUBECONFIG.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past KUBECONFIG check (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

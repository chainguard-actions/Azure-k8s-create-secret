name: Test docker-registry secret type with fake cluster
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          cat > "$HOME/.kube/config" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
            name: fake-cluster
          contexts:
          - context:
              cluster: fake-cluster
              user: fake-user
              namespace: default
            name: fake-context
          current-context: fake-context
          users:
          - name: fake-user
            user:
              token: fake-token
          EOF
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          secret-name: my-registry-secret
          secret-type: kubernetes.io/dockerconfigjson
          container-registry-url: myregistry.azurecr.io
          container-registry-username: myuser
          container-registry-password: mypassword
          container-registry-email: test@example.com
          namespace: default

      - name: Assert action output and graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SECRET_NAME: ${{ steps.action.outputs.secret-name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "secret-name output: $SECRET_NAME"
          if [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded, verify the output is set
            if [ -z "$SECRET_NAME" ]; then
              echo "FAIL: action succeeded but secret-name output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with secret-name='$SECRET_NAME'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real cluster available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
